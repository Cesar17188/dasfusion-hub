<header 
  class="fixed top-0 left-0 right-0 z-50 transition-all duration-300"
  [class.glass-panel]="isScrolled()"
  [class.bg-transparent]="!isScrolled()"
  [class.border-b]="isScrolled()"
  [class.border-outline-variant]="isScrolled()">
  
  <div class="max-w-[1280px] mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-20">
      
      <!-- Logo DASFusion -->
      <a routerLink="/" class="flex items-center gap-3 group">
        <img 
          src="https://whlxncobakktxghxdyfw.supabase.co/storage/v1/object/public/general/logoDasfusionDegradado.webp" 
          alt="DASFusion Logo" 
          class="w-10 h-10 object-contain rounded-xl group-hover:scale-105 transition-transform duration-300 drop-shadow-[0_0_12px_rgba(206,206,251,0.2)]"
        />
        <div class="flex flex-col">
          <span class="text-xl font-bold tracking-tight text-on-surface group-hover:text-primary transition-colors">
            DAS<span class="text-primary font-extrabold">Fusion</span>
          </span>
          <span class="text-[10px] font-semibold uppercase tracking-widest text-on-surface-variant">PROCESS &amp; CODE</span>
        </div>
      </a>

      <!-- Desktop Navigation Tabs -->
      <nav class="hidden md:flex items-center gap-1 bg-surface-container-low/80 backdrop-blur-md px-4 py-1.5 rounded-full border border-outline-variant/60 shadow-inner">
        <a 
          href="#inicio"
          class="px-4 py-2 text-sm font-semibold rounded-full text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high transition-all duration-200">
          Inicio
        </a>
        <a 
          href="#cotizador"
          class="px-4 py-2 text-sm font-semibold rounded-full text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high transition-all duration-200">
          Cotizador
        </a>
        <a 
          href="#oficina"
          class="px-4 py-2 text-sm font-semibold rounded-full text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high transition-all duration-200">
          Oficina
        </a>
        <a 
          href="#proyectos"
          class="px-4 py-2 text-sm font-semibold rounded-full text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high transition-all duration-200">
          Proyectos
        </a>
        <a 
          href="#equipo"
          class="px-4 py-2 text-sm font-semibold rounded-full text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high transition-all duration-200">
          Equipo
        </a>
      </nav>

      <!-- Right: User Profile Icon & Quick Action -->
      <div class="hidden md:flex items-center gap-4">
        <a href="#cotizador" class="btn-primary text-xs py-2! px-4!">
          <span>Cotizar Proyecto</span>
        </a>

        <!-- User Profile Avatar/Trigger -->
        <div class="relative">
          <button 
            (click)="toggleUserMenu()" 
            type="button"
            class="w-10 h-10 rounded-full bg-surface-container-high border border-outline-variant hover:border-primary transition-colors flex items-center justify-center p-0.5 group focus:outline-none focus:ring-2 focus:ring-primary/40">
            <div class="w-full h-full rounded-full bg-linear-to-tr from-surface-container-highest to-primary/20 flex items-center justify-center text-primary font-bold text-sm overflow-hidden">
              <svg class="w-5 h-5 text-on-surface-variant group-hover:text-primary transition-colors" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </div>
          </button>

          <!-- User dropdown panel -->
          @if (isUserMenuOpen()) {
            <div class="absolute right-0 mt-3 w-56 das-card p-2 shadow-2xl z-50 border border-outline-variant animate-in fade-in slide-in-from-top-2 duration-200">
              <div class="px-3 py-2 border-b border-outline-variant/40 mb-1">
                <p class="text-xs font-semibold text-on-surface">DASFusion Portal</p>
                <p class="text-[11px] text-on-surface-variant truncate">portal&#64;dasfusion.com</p>
              </div>
              <a href="#cotizador" (click)="closeUserMenu()" class="flex items-center gap-2 px-3 py-2 text-xs text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high rounded-md transition-colors">
                <svg class="w-4 h-4 text-primary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
                Mis Propuestas
              </a>
              <a href="#proyectos" (click)="closeUserMenu()" class="flex items-center gap-2 px-3 py-2 text-xs text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high rounded-md transition-colors">
                <svg class="w-4 h-4 text-tertiary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
                Proyectos Activos
              </a>
            </div>
          }
        </div>
      </div>

      <!-- Mobile Menu Button -->
      <div class="flex md:hidden items-center gap-3">
        <button 
          (click)="toggleMobileMenu()"
          type="button"
          class="p-2 rounded-lg bg-surface-container border border-outline-variant text-on-surface hover:text-primary transition-colors focus:outline-none">
          @if (!isMobileMenuOpen()) {
            <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
          } @else {
            <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
          }
        </button>
      </div>

    </div>
  </div>

  <!-- Mobile dropdown drawer -->
  @if (isMobileMenuOpen()) {
    <div class="md:hidden glass-panel border-b border-outline-variant px-4 pt-2 pb-6 space-y-2 animate-in fade-in slide-in-from-top-4 duration-200">
      <a (click)="closeMobileMenu()" href="#inicio" class="block px-3 py-2 rounded-md text-base font-semibold text-on-surface hover:bg-surface-container-high">Inicio</a>
      <a (click)="closeMobileMenu()" href="#cotizador" class="block px-3 py-2 rounded-md text-base font-semibold text-on-surface hover:bg-surface-container-high">Cotizador</a>
      <a (click)="closeMobileMenu()" href="#oficina" class="block px-3 py-2 rounded-md text-base font-semibold text-on-surface hover:bg-surface-container-high">Oficina</a>
      <a (click)="closeMobileMenu()" href="#proyectos" class="block px-3 py-2 rounded-md text-base font-semibold text-on-surface hover:bg-surface-container-high">Proyectos</a>
      <a (click)="closeMobileMenu()" href="#equipo" class="block px-3 py-2 rounded-md text-base font-semibold text-on-surface hover:bg-surface-container-high">Equipo</a>
      <div class="pt-4 border-t border-outline-variant/40 flex flex-col gap-3">
        <a (click)="closeMobileMenu()" href="#cotizador" class="btn-primary w-full text-center">Cotizar Proyecto</a>
      </div>
    </div>
  }
</header>
